<!DOCTYPE html>
<html>
<head>
  <title>Drink Driving Awareness</title>
  <style>
    body{
      font-family: Arial;
      background:#0f172a;
      color:white;
      text-align:center;
      padding:40px;
    }
    .box{
      background:#1e293b;
      padding:30px;
      border-radius:20px;
      max-width:600px;
      margin:auto;
    }
    button{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#38bdf8;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Drink-Driving Awareness Simulator</h1>
    <p>
      Educational app showing how alcohol affects reaction time,
      steering and vision.
    </p>

    <h2>Beer: 375ml</h2>
    <p>Estimated impairment: Moderate</p>

    <button onclick="alert('Do not drink and drive')">
      Start Simulation
    </button>
  </div>
</body>
</html>
